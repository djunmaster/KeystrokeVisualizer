appId: com.keystroke-visualizer.app
productName: Keystroke Visualizer
copyright: Copyright 2026 djunmaster
icon: resources/icons/icon.png

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json
  - LICENSE

extraResources:
  - from: resources/tray-icons
    to: tray-icons
    filter:
      - "**/*"

mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip

win:
  target:
    - nsis
    - portable
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  category: Utility
  target:
    - AppImage
    - deb
